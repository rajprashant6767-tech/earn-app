<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZyloBet Pro - Aviator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #05070a; color: white; font-family: sans-serif; }
        .glass { background: rgba(20, 25, 35, 0.95); border: 1px solid #333; }
        .glow { filter: drop-shadow(0 0 10px #f97316); }
    </style>
</head>
<body class="p-4 pb-20">

    <!-- Dashboard -->
    <div id="main-ui">
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-xl font-black">ZyloBet</h1>
                <p id="tg-user" class="text-[10px] text-blue-400 font-bold">@Connecting...</p>
            </div>
            <a href="https://t.me/+2vDL5Gmbee0zNDFl" target="_blank" class="text-2xl text-blue-500"><i class="fa-brands fa-telegram"></i></a>
        </header>

        <!-- Wallet Card -->
        <div class="glass p-5 rounded-3xl mb-6 border-orange-500/20">
            <div class="flex justify-between mb-4">
                <p class="text-gray-400 text-xs">Wallet</p>
                <button onclick="showModal('deposit')" class="text-orange-500 text-xs font-bold underline">Deposit (UPI)</button>
            </div>
            <div class="flex gap-8">
                <div><p class="text-2xl font-black text-amber-400" id="coins">1,250</p><p class="text-[9px]">COINS</p></div>
                <div><p class="text-2xl font-black text-cyan-400" id="gems">12</p><p class="text-[9px]">DIAMONDS</p></div>
            </div>
        </div>

        <!-- Games -->
        <div class="grid grid-cols-2 gap-4">
            <button onclick="openGame('aviator')" class="glass p-6 rounded-3xl text-center border-orange-500/20 hover:border-orange-500">
                <i class="fa-solid fa-rocket text-4xl text-orange-500 mb-2"></i>
                <p class="text-xs font-bold">AVIATOR PRO</p>
            </button>
            <button onclick="alert('Coming Soon')" class="glass p-6 rounded-3xl text-center border-gray-800">
                <i class="fa-solid fa-circle-half-stroke text-4xl text-purple-500 mb-2"></i>
                <p class="text-xs font-bold">COIN FLIP</p>
            </button>
        </div>
    </div>

    <!-- Aviator Pro UI -->
    <div id="aviator-ui" class="hidden fixed inset-0 z-50 bg-black p-4 flex flex-col">
        <button onclick="closeGame()" class="text-gray-400 mb-4"><i class="fa-solid fa-xmark text-xl"></i></button>
        <div class="flex-1 flex flex-col items-center justify-center glass rounded-3xl p-6">
            <div id="mult" class="text-7xl font-black text-white glow mb-10">1.00x</div>
            <div id="rocket" class="text-6xl text-orange-500 mb-10"><i class="fa-solid fa-rocket transform -rotate-45"></i></div>
            <button id="bet-btn" onclick="startAviator()" class="w-full py-4 bg-gradient-to-r from-orange-600 to-red-600 rounded-2xl font-black text-lg">PLACE BET</button>
        </div>
    </div>

    <!-- Modal System -->
    <div id="modal" class="hidden fixed inset-0 bg-black/90 z-[60] p-6 flex flex-col justify-center">
        <div class="glass p-6 rounded-3xl">
            <h2 id="modal-title" class="font-bold mb-4 text-center">Deposit via UPI</h2>
            <p class="text-[10px] text-gray-400 mb-2">UPI: raj-prashant@fam</p>
            <input type="file" class="w-full mb-4 text-xs bg-gray-800 p-2 rounded">
            <button onclick="alert('Proof Sent to Admin!')" class="w-full py-3 bg-blue-600 rounded-xl font-bold">SEND PROOF</button>
            <button onclick="document.getElementById('modal').classList.add('hidden')" class="w-full mt-2 text-gray-500 text-xs">Close</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        // Load User
        const name = tg.initDataUnsafe?.user?.first_name || "Player";
        document.getElementById('tg-user').innerText = "@" + name;

        function openGame(g) { document.getElementById('main-ui').classList.add('hidden'); document.getElementById('aviator-ui').classList.remove('hidden'); }
        function closeGame() { document.getElementById('main-ui').classList.remove('hidden'); document.getElementById('aviator-ui').classList.add('hidden'); }
        function showModal(t) { document.getElementById('modal').classList.remove('hidden'); }

        // Game Logic
        function startAviator() {
            let m = 1.00;
            const btn = document.getElementById('bet-btn');
            btn.disabled = true;
            btn.innerText = "FLYING...";
            let interval = setInterval(() => {
                m += 0.25;
                document.getElementById('mult').innerText = m.toFixed(2) + "x";
                if(m > 6.0) {
                    clearInterval(interval);
                    btn.disabled = false;
                    btn.innerText = "PLACE BET";
                    alert("Crashed!");
                }
            }, 300);
        }
    </script>
</body>
</html>
