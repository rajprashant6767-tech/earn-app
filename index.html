<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZyloBet | Official App & Admin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #05070a; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .card { background: linear-gradient(145deg, #111, #000); border: 1px solid #222; }
    </style>
</head>
<body class="p-4 pb-20 max-w-lg mx-auto">

    <!-- Admin Panel Toggle Bar (Strictly shown only for Admin ID: 7927224931) -->
    <div id="admin-toggle-bar" class="hidden mb-4 bg-orange-600/20 border border-orange-500/40 p-2.5 rounded-xl flex justify-between items-center text-xs">
        <span class="text-orange-400 font-bold"><i class="fa-solid fa-shield-halved mr-1"></i> Admin Access Granted</span>
        <button onclick="toggleAdminView()" id="view-toggle-btn" class="bg-orange-600 text-white px-3 py-1 rounded-lg font-bold shadow">Open Admin Panel</button>
    </div>

    <!-- USER APP VIEW -->
    <div id="user-view">
        <header class="flex justify-between items-center mb-5">
            <div class="flex items-center gap-3">
                <div id="user-avatar-container" class="w-10 h-10 rounded-full bg-gradient-to-tr from-orange-500 to-red-600 flex items-center justify-center font-bold text-lg shadow-lg border border-orange-400/30 overflow-hidden">
                    <span id="user-avatar-text">U</span>
                </div>
                <div>
                    <h1 class="text-lg font-black text-orange-500 italic leading-none">ZyloBet</h1>
                    <p id="tg-user" class="text-[10px] text-blue-400 font-bold mt-1">@Loading...</p>
                </div>
            </div>
        </header>

        <div class="card p-6 rounded-3xl mb-5 shadow-2xl border-orange-500/30 space-y-4">
            <div class="flex justify-between items-center pb-3 border-b border-gray-800">
                <div>
                    <p class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">Quick Deposit</p>
                    <p class="text-xs text-white font-semibold">Buy Diamonds via UPI</p>
                </div>
                <button onclick="openDepositModal()" class="bg-gradient-to-r from-orange-500 to-red-600 text-white text-xs px-4 py-2 rounded-xl font-bold shadow-lg">DEPOSIT</button>
            </div>

            <div class="grid grid-cols-2 gap-4 pt-1">
                <div class="bg-gray-900/60 p-3 rounded-2xl border border-gray-800">
                    <p class="text-2xl font-black text-amber-400" id="user-coins">1,250</p>
                    <p class="text-[10px] text-gray-400 font-bold mt-1">COINS</p>
                </div>
                <div class="bg-gray-900/60 p-3 rounded-2xl border border-gray-800">
                    <p class="text-2xl font-black text-cyan-400" id="user-gems">12</p>
                    <p class="text-[10px] text-gray-400 font-bold mt-1">DIAMONDS</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-5">
            <button onclick="openModal('withdraw')" class="card p-5 rounded-2xl text-center">
                <i class="fa-solid fa-wallet text-2xl text-green-500 mb-2"></i>
                <p class="text-[10px] font-bold">WITHDRAW</p>
            </button>
            <button onclick="openModal('promo')" class="card p-5 rounded-2xl text-center">
                <i class="fa-solid fa-gift text-2xl text-purple-500 mb-2"></i>
                <p class="text-[10px] font-bold">PROMO CODE</p>
            </button>
        </div>
    </div>

    <!-- ADMIN PANEL VIEW -->
    <div id="admin-view" class="hidden space-y-4">
        <div class="card p-4 rounded-2xl border-orange-500/30 flex justify-between items-center">
            <div>
                <h1 class="text-base font-black text-orange-500 italic">ZyloBet Admin Panel</h1>
                <p class="text-[10px] text-gray-400">Live Requests & Proofs</p>
            </div>
            <button onclick="loadAdminRequests()" class="bg-gray-800 text-xs px-3 py-1.5 rounded-xl font-bold text-amber-400">
                <i class="fa-solid fa-rotate"></i> Refresh
            </button>
        </div>

        <div class="grid grid-cols-2 gap-2">
            <button onclick="switchAdminTab('deposit')" id="adm-tab-dep" class="py-2.5 bg-orange-600 rounded-xl font-bold text-xs shadow">Deposit Requests</button>
            <button onclick="switchAdminTab('withdraw')" id="adm-tab-wit" class="py-2.5 bg-gray-900 border border-gray-800 text-gray-400 rounded-xl font-bold text-xs shadow">Withdrawal Requests</button>
        </div>

        <div id="admin-requests-container" class="space-y-3"></div>
    </div>

    <!-- Modals -->
    <div id="modal" class="hidden fixed inset-0 z-50 bg-black/95 p-6 flex flex-col justify-center">
        <div class="card p-6 rounded-3xl border border-gray-700">
            <h2 id="modal-title" class="font-bold text-center mb-6 text-sm tracking-wider">Request</h2>
            <div id="modal-content" class="space-y-4"></div>
            <button onclick="closeModal()" class="w-full mt-4 text-gray-400 text-xs font-semibold py-2">CANCEL</button>
        </div>
    </div>

    <div id="img-modal" class="hidden fixed inset-0 z-50 bg-black/95 p-6 flex flex-col items-center justify-center">
        <img id="modal-img" src="" alt="Proof" class="max-h-[80vh] max-w-full rounded-xl border border-gray-700 mb-4 object-contain">
        <button onclick="document.getElementById('img-modal').classList.add('hidden')" class="px-6 py-2 bg-gray-800 rounded-xl font-bold text-xs">CLOSE PROOF</button>
    </div>

    <script>
        const ADMIN_ID = "7927224931";
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        const user = tg.initDataUnsafe?.user;
        const username = user ? (user.username || user.first_name) : "Player";
        const userId = user ? user.id.toString() : "";

        document.getElementById('tg-user').innerText = "@" + username;

        // Check if logged-in user is the Admin (7927224931)
        if(userId === ADMIN_ID || true) { // (Note: testing ke liye active hai, actual mein userId === ADMIN_ID check hoga)
            document.getElementById('admin-toggle-bar').classList.remove('hidden');
        }

        let isViewingAdmin = false;
        let adminTab = 'deposit';

        function toggleAdminView() {
            isViewingAdmin = !isViewingAdmin;
            if(isViewingAdmin) {
                document.getElementById('user-view').classList.add('hidden');
                document.getElementById('admin-view').classList.remove('hidden');
                document.getElementById('view-toggle-btn').innerText = "Back to User App";
                loadAdminRequests();
            } else {
                document.getElementById('admin-view').classList.add('hidden');
                document.getElementById('user-view').classList.remove('hidden');
                document.getElementById('view-toggle-btn').innerText = "Open Admin Panel";
            }
        }

        // Wallet data sync
        let userCoins = parseInt(localStorage.getItem('zylobet_coins')) || 1250;
        let userGems = parseInt(localStorage.getItem('zylobet_gems')) || 12;
        document.getElementById('user-coins').innerText = userCoins.toLocaleString();
        document.getElementById('user-gems').innerText = userGems;

        function openDepositModal() {
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal-title').innerText = "DEPOSIT DIAMONDS";
            document.getElementById('modal-content').innerHTML = `
                <div class='space-y-3 text-xs'>
                    <div class='bg-cyan-500/10 border border-cyan-500/30 p-2.5 rounded-xl text-cyan-300 font-semibold text-center'>
                        💎 1 Diamond = ₹1 Rs
                    </div>
                    <label class='text-gray-300 font-semibold block'>Enter Diamond Amount (1 - 1000):</label>
                    <input type='number' id='deposit-amount-input' min='1' max='1000' placeholder='e.g. 100' class='w-full bg-gray-900 border border-gray-800 p-3 rounded-xl font-bold text-cyan-400'>
                    <p id='deposit-err' class='text-red-400 text-[10px] h-3 font-medium'></p>
                    <button onclick='proceedToPayment()' class='w-full py-3 bg-gradient-to-r from-orange-500 to-red-600 rounded-xl font-bold text-xs'>NEXT</button>
                </div>`;
        }

        function proceedToPayment() {
            const amountInput = document.getElementById('deposit-amount-input');
            const errField = document.getElementById('deposit-err');
            const amt = parseInt(amountInput.value);

            if(isNaN(amt) || amt < 1 || amt > 1000) {
                errField.innerText = "❌ Please enter a valid amount between 1 and 1000 diamonds.";
                return;
            }

            document.getElementById('modal-title').innerText = `PAYMENT FOR ${amt} DIAMONDS`;
            document.getElementById('modal-content').innerHTML = `
                <div class='space-y-3 text-xs text-center max-h-[70vh] overflow-y-auto px-1'>
                    <p class='text-gray-300'>Send payment to UPI ID:</p>
                    <div class='bg-gray-900 border border-gray-800 p-3 rounded-xl font-mono text-orange-400 font-bold select-all'>raj-prashant@fam</div>
                    
                    <p class='text-gray-400 text-[10px] text-left'>Payment screenshot upload karein:</p>
                    <input type='file' id='payment-proof-file' accept='image/*' class='w-full bg-gray-900 border border-gray-800 p-2 text-xs rounded-xl'>
                    <p id='proof-err' class='text-red-400 text-[10px] h-3 font-medium text-left'></p>
                    
                    <button onclick="submitDepositProof('${username}', ${amt})" class='w-full py-3 bg-gradient-to-r from-green-500 to-emerald-600 rounded-xl font-bold text-xs'>SEND PROOF</button>
                </div>`;
        }

        function submitDepositProof(uname, amt) {
            const fileInput = document.getElementById('payment-proof-file');
            const proofErr = document.getElementById('proof-err');

            if(fileInput.files.length === 0) {
                proofErr.innerText = "❌ Please select a payment proof screenshot first!";
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                let requests = JSON.parse(localStorage.getItem('zylobet_deposit_requests')) || [];
                requests.push({
                    id: Date.now(),
                    username: "@" + uname,
                    amount: amt,
                    proof: e.target.result,
                    time: "Just now"
                });
                localStorage.setItem('zylobet_deposit_requests', JSON.stringify(requests));

                alert(`Deposit request for ${amt} Diamonds submitted successfully!`);
                closeModal();
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function openModal(type) {
            document.getElementById('modal').classList.remove('hidden');
            if(type === 'withdraw') {
                document.getElementById('modal-title').innerText = "WITHDRAW COINS";
                document.getElementById('modal-content').innerHTML = `
                    <select id='w-method' class='w-full bg-gray-900 border border-gray-800 p-3 text-xs rounded-xl'><option>UPI</option><option>Amazon Gift Card</option></select>
                    <input type='number' id='w-amt' placeholder='Enter Coins Amount' class='w-full bg-gray-900 border border-gray-800 p-3 text-xs rounded-xl'>
                    <button onclick="submitWithdraw('${username}')" class='w-full py-3 bg-green-600 rounded-xl font-bold text-xs'>WITHDRAW NOW</button>`;
            } else if(type === 'promo') {
                document.getElementById('modal-title').innerText = "PROMO CODE";
                document.getElementById('modal-content').innerHTML = `
                    <input class='w-full bg-gray-900 border border-gray-800 p-3 text-xs rounded-xl' placeholder='Enter Promo Code'>
                    <button onclick="alert('Applied Successfully!'); closeModal();" class='w-full py-3 bg-blue-600 rounded-xl font-bold text-xs'>APPLY</button>`;
            }
        }

        function submitWithdraw(uname) {
            const method = document.getElementById('w-method').value;
            const amt = document.getElementById('w-amt').value;
            if(!amt || amt <= 0) { alert("Enter valid amount"); return; }

            let reqs = JSON.parse(localStorage.getItem('zylobet_withdraw_requests')) || [];
            reqs.push({ id: Date.now(), username: "@" + uname, method: method, amount: amt, time: "Just now" });
            localStorage.setItem('zylobet_withdraw_requests', JSON.stringify(reqs));
            alert("Withdrawal Request Sent!");
            closeModal();
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        // ADMIN PANEL FUNCTIONS
        function switchAdminTab(tab) {
            adminTab = tab;
            const dBtn = document.getElementById('adm-tab-dep');
            const wBtn = document.getElementById('adm-tab-wit');
            if(tab === 'deposit') {
                dBtn.className = "py-2.5 bg-orange-600 rounded-xl font-bold text-xs shadow";
                wBtn.className = "py-2.5 bg-gray-900 border border-gray-800 text-gray-400 rounded-xl font-bold text-xs shadow";
            } else {
                wBtn.className = "py-2.5 bg-orange-600 rounded-xl font-bold text-xs shadow";
                dBtn.className = "py-2.5 bg-gray-900 border border-gray-800 text-gray-400 rounded-xl font-bold text-xs shadow";
            }
            loadAdminRequests();
        }

        function loadAdminRequests() {
            const container = document.getElementById('admin-requests-container');
            container.innerHTML = '';

            if(adminTab === 'deposit') {
                let reqs = JSON.parse(localStorage.getItem('zylobet_deposit_requests')) || [];
                if(reqs.length === 0) {
                    container.innerHTML = `<div class='card p-6 text-center text-gray-500 text-xs rounded-2xl'>No pending deposit requests.</div>`;
                    return;
                }
                reqs.forEach(r => {
                    container.innerHTML += `
                        <div class='card p-3 rounded-2xl border border-gray-800 space-y-2 text-xs'>
                            <div class='flex justify-between font-bold'><span class='text-blue-400'>${r.username}</span><span class='text-cyan-400'>${r.amount} Diamonds</span></div>
                            <button onclick="document.getElementById('modal-img').src='${r.proof}'; document.getElementById('img-modal').classList.remove('hidden');" class='w-full bg-gray-800 py-1.5 rounded-lg font-bold text-[10px]'>View Proof Screenshot</button>
                            <div class='grid grid-cols-2 gap-2'>
                                <button onclick="handleAdmDep(${r.id}, 'approve', ${r.amount})" class='bg-green-600 py-2 rounded-xl font-bold'>APPROVE</button>
                                <button onclick="handleAdmDep(${r.id}, 'reject', 0)" class='bg-red-600 py-2 rounded-xl font-bold'>REJECT</button>
                            </div>
                        </div>`;
                });
            } else {
                let reqs = JSON.parse(localStorage.getItem('zylobet_withdraw_requests')) || [];
                if(reqs.length === 0) {
                    container.innerHTML = `<div class='card p-6 text-center text-gray-500 text-xs rounded-2xl'>No pending withdrawal requests.</div>`;
                    return;
                }
                reqs.forEach(r => {
                    container.innerHTML += `
                        <div class='card p-3 rounded-2xl border border-gray-800 space-y-2 text-xs'>
                            <div class='flex justify-between font-bold'><span class='text-blue-400'>${r.username}</span><span class='text-amber-400'>${r.amount} Coins</span></div>
                            <p class='text-gray-400'>Method: ${r.method}</p>
                            <div class='grid grid-cols-2 gap-2'>
                                <button onclick="handleAdmWit(${r.id}, 'approve')" class='bg-green-600 py-2 rounded-xl font-bold'>APPROVE</button>
                                <button onclick="handleAdmWit(${r.id}, 'reject')" class='bg-red-600 py-2 rounded-xl font-bold'>REJECT</button>
                            </div>
                        </div>`;
                });
            }
        }

        function handleAdmDep(id, action, amt) {
            let reqs = JSON.parse(localStorage.getItem('zylobet_deposit_requests')) || [];
            if(action === 'approve') {
                let gems = parseInt(localStorage.getItem('zylobet_gems')) || 12;
                gems += amt;
                localStorage.setItem('zylobet_gems', gems);
                document.getElementById('user-gems').innerText = gems;
                alert(`Approved! ${amt} Diamonds added to user balance.`);
            } else {
                alert("Deposit Request Rejected.");
            }
            reqs = reqs.filter(x => x.id !== id);
            localStorage.setItem('zylobet_deposit_requests', JSON.stringify(reqs));
            loadAdminRequests();
        }

        function handleAdmWit(id, action) {
            let reqs = JSON.parse(localStorage.getItem('zylobet_withdraw_requests')) || [];
            if(action === 'approve') { alert("Withdrawal Request Approved."); }
            else { alert("Withdrawal Request Rejected."); }
            reqs = reqs.filter(x => x.id !== id);
            localStorage.setItem('zylobet_withdraw_requests', JSON.stringify(reqs));
            loadAdminRequests();
        }
    </script>
</body>
</html>
