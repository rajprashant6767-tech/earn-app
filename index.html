<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZyloBet Mini App</title>
    <!-- Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #05070a; color: white; font-family: sans-serif; }
        .glass { background: rgba(20, 25, 35, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <!-- Loading State -->
    <div id="loader" class="text-center">
        <i class="fa-solid fa-spinner animate-spin text-4xl text-orange-500"></i>
        <p class="mt-4 text-sm font-bold">Authenticating Telegram...</p>
    </div>

    <!-- Main Content (Hidden until Login) -->
    <div id="main-app" class="hidden w-full max-w-md min-h-screen flex flex-col">
        <!-- Header -->
        <header class="p-4 flex justify-between items-center glass border-b border-gray-800">
            <div>
                <h1 class="font-bold">ZyloBet</h1>
                <p id="tg-username" class="text-[10px] text-blue-400 font-bold"></p>
            </div>
            <div class="text-[10px] bg-black px-3 py-1 rounded-full border border-gray-800">
                <span class="text-amber-400 mr-2"><i class="fa-solid fa-coins"></i> 1,150</span>
                <span class="text-cyan-400"><i class="fa-solid fa-gem"></i> 12</span>
            </div>
        </header>

        <!-- Aviator Banner -->
        <main class="flex-1 p-4">
            <div onclick="showGame()" class="p-8 rounded-3xl bg-gradient-to-br from-indigo-900 to-black border border-indigo-500 text-center cursor-pointer hover:opacity-90">
                <i class="fa-solid fa-rocket text-5xl text-orange-500 animate-pulse"></i>
                <h2 class="mt-4 text-xl font-black">AVIATOR FLIGHT</h2>
            </div>
        </main>
    </div>

    <!-- Game Interface -->
    <div id="game-ui" class="hidden fixed inset-0 z-50 bg-[#05070a] p-4">
        <button onclick="hideGame()" class="text-gray-400 mb-4"><i class="fa-solid fa-arrow-left"></i> Exit</button>
        <div class="glass h-[80%] rounded-3xl flex flex-col items-center justify-center border border-gray-700">
            <div id="mult" class="text-6xl font-black mb-10 text-orange-500">1.00x</div>
            <button id="bet-btn" onclick="playGame()" class="w-[80%] py-4 bg-green-600 rounded-2xl font-bold">PLACE BET (100)</button>
            <div class="mt-10 flex items-center gap-3 bg-gray-900 p-3 rounded-2xl w-[80%]">
                <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center font-bold" id="user-initial"></div>
                <p id="player-tag" class="text-sm font-bold"></p>
            </div>
        </div>
    </div>

    <script>
        // Init Telegram
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        // Telegram Data Fetching
        window.onload = () => {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                document.getElementById('tg-username').innerText = "@" + (user.username || user.first_name);
                document.getElementById('player-tag').innerText = user.first_name;
                document.getElementById('user-initial').innerText = user.first_name.charAt(0);
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
            } else {
                // Fallback for non-telegram browser
                document.getElementById('tg-username').innerText = "@GuestUser";
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
            }
        };

        function showGame() { document.getElementById('game-ui').classList.remove('hidden'); }
        function hideGame() { document.getElementById('game-ui').classList.add('hidden'); }

        function playGame() {
            const btn = document.getElementById('bet-btn');
            const mult = document.getElementById('mult');
            btn.disabled = true;
            let m = 1.00;
            let interval = setInterval(() => {
                m += 0.25;
                mult.innerText = m.toFixed(2) + "x";
                if(m > 5) {
                    clearInterval(interval);
                    alert("Crashed!");
                    btn.disabled = false;
                    mult.innerText = "1.00x";
                }
            }, 300);
        }
    </script>
</body>
</html>
