<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZyloBet | Official App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #05070a; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .card { background: linear-gradient(145deg, #111, #000); border: 1px solid #222; }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(249,115,22,0.4)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 30px rgba(249,115,22,0.8)); }
        }
        .animate-glow { animation: pulseGlow 2s infinite ease-in-out; }
    </style>
</head>
<body class="p-4 pb-20">

    <!-- Attractive Intro Splash Screen -->
    <div id="intro-screen" class="fixed inset-0 z-[100] bg-[#05070a] flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="text-center space-y-4">
            <div class="w-24 h-24 rounded-3xl bg-gradient-to-tr from-orange-500 to-red-600 mx-auto flex items-center justify-center text-white text-4xl shadow-2xl animate-glow">
                <i class="fa-solid fa-bolt-lightning"></i>
            </div>
            <div>
                <h1 class="text-3xl font-black tracking-wider text-orange-500 italic">ZyloBet</h1>
                <p class="text-xs text-gray-400 mt-1 uppercase tracking-widest font-semibold">Official Mini App</p>
            </div>
            <div class="w-36 h-1 bg-gray-800 rounded-full mx-auto overflow-hidden mt-4">
                <div id="intro-bar" class="h-full bg-gradient-to-r from-orange-500 to-amber-400 w-0 transition-all duration-500"></div>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="main-app" class="opacity-0 transition-opacity duration-500">
        <!-- Header Section with Telegram Profile Photo / Initial -->
        <header class="flex justify-between items-center mb-5">
            <div class="flex items-center gap-3">
                <div id="user-avatar-container" class="w-10 h-10 rounded-full bg-gradient-to-tr from-orange-500 to-red-600 flex items-center justify-center font-bold text-lg shadow-lg border border-orange-400/30 overflow-hidden">
                    <span id="user-avatar-text">U</span>
                </div>
                <div>
                    <h1 class="text-lg font-black text-orange-500 italic leading-none">ZyloBet</h1>
                    <p id="tg-user" class="text-[10px] text-blue-400 font-bold mt-1">@Loading...</p>
                </div>
            </div>
        </header>

        <!-- Wallet Dashboard (Deposit & Balances on Top) -->
        <div class="card p-6 rounded-3xl mb-5 shadow-2xl border-orange-500/30 space-y-4">
            <!-- Deposit Box Top -->
            <div class="flex justify-between items-center pb-3 border-b border-gray-800">
                <div>
                    <p class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">Quick Deposit</p>
                    <p class="text-xs text-white font-semibold">Buy Diamonds via UPI</p>
                </div>
                <button onclick="openDepositModal()" class="bg-gradient-to-r from-orange-500 to-red-600 text-white text-xs px-4 py-2 rounded-xl font-bold shadow-lg">DEPOSIT</button>
            </div>

            <!-- Clickable Balance Boxes for History -->
            <div class="grid grid-cols-2 gap-4 pt-1">
                <div onclick="openHistory('coins')" class="bg-gray-900/60 p-3 rounded-2xl border border-gray-800 cursor-pointer hover:border-amber-400/50 transition">
                    <p class="text-2xl font-black text-amber-400" id="coins">1,250</p>
                    <p class="text-[10px] text-gray-400 font-bold flex items-center justify-between mt-1">
                        <span>COINS</span> <i class="fa-solid fa-clock-rotate-left text-xs text-amber-400"></i>
                    </p>
                </div>
                <div onclick="openHistory('gems')" class="bg-gray-900/60 p-3 rounded-2xl border border-gray-800 cursor-pointer hover:border-cyan-400/50 transition">
                    <p class="text-2xl font-black text-cyan-400" id="gems">12</p>
                    <p class="text-[10px] text-gray-400 font-bold flex items-center justify-between mt-1">
                        <span>DIAMONDS</span> <i class="fa-solid fa-clock-rotate-left text-xs text-cyan-400"></i>
                    </p>
                </div>
            </div>
        </div>

        <!-- Main Features -->
        <div class="grid grid-cols-2 gap-4 mb-5">
            <button onclick="openModal('withdraw')" class="card p-5 rounded-2xl text-center hover:border-green-500/50 transition">
                <i class="fa-solid fa-wallet text-2xl text-green-500 mb-2"></i>
                <p class="text-[10px] font-bold">WITHDRAW</p>
            </button>
            <button onclick="openModal('promo')" class="card p-5 rounded-2xl text-center hover:border-purple-500/50 transition">
                <i class="fa-solid fa-gift text-2xl text-purple-500 mb-2"></i>
                <p class="text-[10px] font-bold">PROMO CODE</p>
            </button>
        </div>

        <!-- Referral Section with Input Box & Secure Logic -->
        <div class="card p-5 rounded-2xl mb-5 space-y-4">
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-[10px] text-gray-400 uppercase font-semibold">My Referral Code</p>
                    <p id="ref-code" class="font-bold tracking-widest text-orange-400 text-base">Loading...</p>
                </div>
                <button onclick="copyRef()" class="text-xs bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg font-bold transition">COPY</button>
            </div>
            
            <div class="pt-3 border-t border-gray-800 space-y-2">
                <p class="text-[10px] text-gray-300 font-semibold">Have a friend's referral code?</p>
                <div class="flex gap-2">
                    <input type="text" id="friend-ref-input" placeholder="Enter Code (e.g. ZYL1234)" class="w-full bg-gray-900 border border-gray-800 px-3 py-2 text-xs rounded-xl uppercase font-bold text-amber-400 focus:outline-none focus:border-orange-500">
                    <button onclick="applyReferralCode()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-2 rounded-xl font-bold transition shrink-0">APPLY</button>
                </div>
                <p id="ref-status-msg" class="text-[10px] h-3 font-medium"></p>
            </div>
        </div>
    </div>

    <!-- Modal Box -->
    <div id="modal" class="hidden fixed inset-0 z-50 bg-black/95 p-6 flex flex-col justify-center">
        <div class="card p-6 rounded-3xl border border-gray-700">
            <h2 id="modal-title" class="font-bold text-center mb-6 text-sm tracking-wider">Request</h2>
            <div id="modal-content" class="space-y-4"></div>
            <button onclick="closeModal()" class="w-full mt-4 text-gray-400 text-xs font-semibold py-2">CANCEL</button>
        </div>
    </div>

    <script>
        // Intro Animation Sequence
        window.addEventListener('DOMContentLoaded', () => {
            const bar = document.getElementById('intro-bar');
            setTimeout(() => { bar.style.width = '100%'; }, 200);
            setTimeout(() => {
                const intro = document.getElementById('intro-screen');
                intro.style.opacity = '0';
                setTimeout(() => {
                    intro.remove();
                    document.getElementById('main-app').style.opacity = '1';
                }, 700);
            }, 1500);
        });

        const tg = window.Telegram.WebApp;
        tg.ready();
        
        // Telegram Data & Profile Photo Setup
        const user = tg.initDataUnsafe?.user;
        const username = user ? (user.username || user.first_name) : "Player";
        const userId = user?.id ? user.id.toString() : "0000";
        const myReferralCode = "ZYL" + userId.slice(-4);

        document.getElementById('tg-user').innerText = "@" + username;
        document.getElementById('ref-code').innerText = myReferralCode;

        // Telegram Profile Photo handling
        const avatarContainer = document.getElementById('user-avatar-container');
        if(user && user.photo_url) {
            avatarContainer.innerHTML = `<img src="${user.photo_url}" alt="Profile" class="w-full h-full object-cover">`;
        } else if(user && user.first_name) {
            document.getElementById('user-avatar-text').innerText = user.first_name.charAt(0).toUpperCase();
        }

        // Secure Referral Application Logic (Anti-Bypass)
        function applyReferralCode() {
            const inputField = document.getElementById('friend-ref-input');
            const statusMsg = document.getElementById('ref-status-msg');
            const enteredCode = inputField.value.trim().toUpperCase();

            const hasUsedReferral = localStorage.getItem('zylobet_ref_used');
            if(hasUsedReferral === 'true') {
                statusMsg.className = "text-[10px] h-3 font-medium text-red-400";
                statusMsg.innerText = "❌ You have already redeemed a referral code!";
                return;
            }

            if(!enteredCode) {
                statusMsg.className = "text-[10px] h-3 font-medium text-red-400";
                statusMsg.innerText = "❌ Please enter a valid referral code.";
                return;
            }

            if(enteredCode === myReferralCode) {
                statusMsg.className = "text-[10px] h-3 font-medium text-red-400";
                statusMsg.innerText = "❌ You cannot use your own referral code!";
                return;
            }

            localStorage.setItem('zylobet_ref_used', 'true');
            statusMsg.className = "text-[10px] h-3 font-medium text-green-400";
            statusMsg.innerText = "🎉 Referral code applied successfully! Bonus added.";
            inputField.disabled = true;
        }

        // Transaction History Viewer
        function openHistory(type) {
            document.getElementById('modal').classList.remove('hidden');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');

            if(type === 'coins') {
                title.innerText = "COINS TRANSACTION HISTORY";
                content.innerHTML = `
                    <div class='space-y-2 max-h-60 overflow-y-auto text-xs'>
                        <div class='flex justify-between bg-gray-900 p-2.5 rounded-xl border border-gray-800'>
                            <div><p class='font-bold text-emerald-400'>+1,000 Coins</p><p class='text-[9px] text-gray-400'>Welcome Bonus</p></div>
                            <span class='text-[10px] text-gray-500'>Today</span>
                        </div>
                        <div class='flex justify-between bg-gray-900 p-2.5 rounded-xl border border-gray-800'>
                            <div><p class='font-bold text-emerald-400'>+250 Coins</p><p class='text-[9px] text-gray-400'>Referral Reward</p></div>
                            <span class='text-[10px] text-gray-500'>Yesterday</span>
                        </div>
                    </div>`;
            } else if(type === 'gems') {
                title.innerText = "DIAMONDS TRANSACTION HISTORY";
                content.innerHTML = `
                    <div class='space-y-2 max-h-60 overflow-y-auto text-xs'>
                        <div class='flex justify-between bg-gray-900 p-2.5 rounded-xl border border-gray-800'>
                            <div><p class='font-bold text-cyan-400'>+12 Diamonds</p><p class='text-[9px] text-gray-400'>Deposit Approved</p></div>
                            <span class='text-[10px] text-gray-500'>Today</span>
                        </div>
                    </div>`;
            }
        }

        // Step 1: Open Deposit Amount Entry Box (Min 1, Max 1000) with 1 Diamond = 1 Rs info
        function openDepositModal() {
            document.getElementById('modal').classList.remove('hidden');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');

            title.innerText = "DEPOSIT DIAMONDS";
            content.innerHTML = `
                <div class='space-y-3 text-xs'>
                    <div class='bg-cyan-500/10 border border-cyan-500/30 p-2.5 rounded-xl text-cyan-300 font-semibold text-center'>
                        💎 1 Diamond = ₹1 Rs
                    </div>
                    <label class='text-gray-300 font-semibold block'>Enter Diamond Amount (1 - 1000):</label>
                    <input type='number' id='deposit-amount-input' min='1' max='1000' placeholder='e.g. 100' class='w-full bg-gray-900 border border-gray-800 p-3 rounded-xl font-bold text-cyan-400'>
                    <p id='deposit-err' class='text-red-400 text-[10px] h-3 font-medium'></p>
                    <button onclick='proceedToPayment()' class='w-full py-3 bg-gradient-to-r from-orange-500 to-red-600 rounded-xl font-bold text-xs'>NEXT</button>
                </div>`;
        }

        // Step 2: Validate Amount & Proceed to UPI/Proof Upload with Hinglish Notes & Warnings
        function proceedToPayment() {
            const amountInput = document.getElementById('deposit-amount-input');
            const errField = document.getElementById('deposit-err');
            const amt = parseInt(amountInput.value);

            if(isNaN(amt) || amt < 1 || amt > 1000) {
                errField.innerText = "❌ Please enter a valid amount between 1 and 1000 diamonds.";
                return;
            }

            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');

            title.innerText = `PAYMENT FOR ${amt} DIAMONDS`;
            content.innerHTML = `
                <div class='space-y-3 text-xs text-center max-h-[70vh] overflow-y-auto px-1'>
                    <p class='text-gray-300'>Send payment to UPI ID:</p>
                    <div class='bg-gray-900 border border-gray-800 p-3 rounded-xl font-mono text-orange-400 font-bold select-all'>raj-prashant@fam</div>
                    
                    <p class='text-gray-400 text-[10px]'>Payment karne ke baad apna screenshot/proof yahan upload karein:</p>
                    <input type='file' id='payment-proof-file' class='w-full bg-gray-900 border border-gray-800 p-2 text-xs rounded-xl'>
                    
                    <!-- Notes and Warning Section in Hinglish -->
                    <div class='bg-blue-500/10 border border-blue-500/30 p-3 rounded-xl text-left space-y-2 mt-2'>
                        <p class='text-blue-300 text-[10px] font-semibold leading-relaxed'>
                            <i class='fa-solid fa-circle-info mr-1'></i> <b>Note:</b> Deposit ka amount 24 hours ke andar add kar diya jayega. Agar kisi user ko koi problem ho, toh aap humse contact kar sakte hain:
                        </p>
                        <div class='text-center pt-1'>
                            <a href='https://t.me/Raj_Prashant' target='_blank' class='inline-flex items-center gap-1.5 text-xs text-blue-400 font-bold bg-blue-500/20 px-3 py-1.5 rounded-lg'>
                                <i class='fa-brands fa-telegram text-base'></i> Contact: @Raj_Prashant
                            </a>
                        </div>
                    </div>

                    <div class='bg-red-500/10 border border-red-500/30 p-3 rounded-xl text-left'>
                        <p class='text-red-400 text-[10px] font-semibold leading-relaxed'>
                            <i class='fa-solid fa-triangle-exclamation mr-1'></i> <b>Warning:</b> Agar koi user galat payment karega matlab deposit ka amount jitna hai usse kam karega, toh uska request reject kar diya jayega!
                        </p>
                    </div>

                    <button onclick="alert('Deposit request for ${amt} Diamonds submitted successfully!'); closeModal();" class='w-full py-3 bg-gradient-to-r from-green-500 to-emerald-600 rounded-xl font-bold text-xs mt-2'>SUBMIT PROOF</button>
                </div>`;
        }

        function openModal(type) {
            document.getElementById('modal').classList.remove('hidden');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');
            
            if(type === 'withdraw') {
                title.innerText = "WITHDRAW COINS";
                content.innerHTML = `<select class='w-full bg-gray-900 border border-gray-800 p-3 text-xs rounded-xl'><option>UPI</option><option>Amazon Gift Card</option><option>Play Store Gift Card</option></select>
                                    <input type='number' placeholder='Enter Amount' class='w-full bg-gray-900 border border-gray-800 p-3 text-xs rounded-xl'>
                                    <button onclick="alert('Withdrawal Request Sent!'); closeModal();" class='w-full py-3 bg-green-600 rounded-xl font-bold text-xs'>WITHDRAW NOW</button>`;
            } else if(type === 'promo') {
                title.innerText = "PROMO CODE";
                content.innerHTML = `<input class='w-full bg-gray-900 border border-gray-800 p-3 text-xs rounded-xl' placeholder='Enter Promo Code'>
                                    <button onclick="alert('Applied Successfully!'); closeModal();" class='w-full py-3 bg-blue-600 rounded-xl font-bold text-xs mb-3'>APPLY CODE</button>
                                    <div class='text-center pt-2 border-t border-gray-800'>
                                        <a href='https://t.me/+2vDL5Gmbee0zNDFl' target='_blank' class='inline-flex items-center gap-2 text-xs text-blue-400 font-bold bg-blue-500/10 border border-blue-500/20 px-4 py-2.5 rounded-xl w-full justify-center'>
                                            <i class='fa-brands fa-telegram text-base'></i> Join Telegram Channel
                                        </a>
                                    </div>`;
            }
        }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        function copyRef() { navigator.clipboard.writeText(document.getElementById('ref-code').innerText); alert("Referral Code Copied!"); }
    </script>
</body>
</html>
